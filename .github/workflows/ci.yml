name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # package.json has no "engines" field. pnpm 11 needs Node 22.13 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      # Install the pnpm version that package.json pins (single source of truth).
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"

      - name: Find the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # A high-severity advisory fails the job on Linux. macOS runs the same check
      # but only reports it, so one advisory does not show up as two red jobs.
      - name: Audit production dependencies
        run: pnpm run audit:prod
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
