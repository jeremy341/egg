# Egg on your own server: the app, the deployment worker and Caddy (automatic HTTPS).
#
# Start:   cp deploy/.env.example .env, edit .env, then  docker compose up -d --build
# Upgrade: sh deploy/upgrade.sh        Backup: sh deploy/backup.sh
#
# Ports: only Caddy is published (80 and 443). The app listens on 3000 inside the network.
#
# Nothing is built on this server. The worker clones each repository, packs the source and
# sends it to the user's Nest container, where the install and build run under a memory and CPU
# cap. So no service here needs the Docker socket, and none has it.

x-egg: &egg
  image: egg-app:local
  init: true
  restart: unless-stopped
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file: .env
  environment: &egg-env
    NODE_ENV: production
    HOME: /tmp
    DATABASE_URL: ${DATABASE_URL:-file:/data/egg.db}

services:
  app:
    <<: *egg
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      <<: *egg-env
      RUN_WORKER: "0"
    volumes:
      - ${EGG_DATA_DIR:?Set EGG_DATA_DIR in .env}:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *egg
    command: ["node_modules/.bin/tsx", "--tsconfig", "tsconfig.json", "worker/index.ts"]
    environment:
      <<: *egg-env
      # Where the source is cloned and packed. Inside the data folder, so it is writable and survives a restart.
      DEPLOY_WORK_DIR: /data/work
    # Starts after the app is healthy, so only one of them runs the database migrations.
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${EGG_DATA_DIR:?Set EGG_DATA_DIR in .env}:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  # Certificates live here. Keep it, or Caddy asks for new ones and can hit rate limits.
  caddy_data:
  caddy_config:
