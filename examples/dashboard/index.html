<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Everything is inline and the page may only talk to https addresses (and localhost). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>My Egg dashboard</title>
<style>
  :root { --bg: #fbfaf8; --fg: #1d1b19; --muted: #6a645d; --card: #fff; --line: #e4dfd8; --accent: #1f6feb; --good: #1a7f37; --bad: #b42318; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --fg: #efece8; --muted: #a29b92; --card: #1d1b19; --line: #343130; --accent: #6aa5ff; --good: #5fcf7f; --bad: #ff8a80; --warn: #e3b341; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-weight: 500; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin-top: 8px; }
  .bars span { flex: 1; background: var(--accent); min-height: 2px; border-radius: 2px 2px 0 0; }
  .error { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>My Egg dashboard</h1>
  <p class="muted">A read-only page built on the Egg API. Your token stays in this page's memory: it is never saved, and it is gone when you close or reload the tab.</p>

  <section class="card" id="connect-card">
    <form id="connect" autocomplete="off">
      <label>Your Egg address
        <input id="base" type="url" placeholder="https://your-egg" required>
      </label>
      <label>Access token (read-only scopes are enough)
        <input id="token" type="password" placeholder="egg_..." autocomplete="off" spellcheck="false" required>
      </label>
      <div><button class="primary" type="submit">Connect</button></div>
      <p id="connect-error" class="error" role="alert" hidden></p>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card" aria-labelledby="me-h">
      <div class="row">
        <h2 id="me-h">This token</h2>
        <span>
          <button id="refresh" type="button">Refresh</button>
          <button id="disconnect" type="button">Disconnect</button>
        </span>
      </div>
      <p id="me"></p>
    </section>

    <section class="card" aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <p id="projects-note" class="muted" hidden></p>
      <div class="scroll">
        <table id="projects-table" hidden>
          <thead><tr><th scope="col">Name</th><th scope="col">Uptime check</th><th scope="col">Latest deployment</th><th scope="col"></th></tr></thead>
          <tbody id="projects"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="detail" aria-labelledby="detail-h" hidden>
      <h2 id="detail-h"></h2>
      <p id="detail-note" class="muted" hidden></p>
      <div id="detail-body"></div>
    </section>
  </div>
</main>

<script>
"use strict";
// The token lives only in this variable. It is never saved: no browser storage, no cookie, not in the address.
let base = "";
let token = "";
let timer = null;

const $ = (id) => document.getElementById(id);

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text; // always text, never HTML
  if (className) node.className = className;
  return node;
}

class ApiError extends Error {
  constructor(status, code, message) { super(message); this.status = status; this.code = code; }
}

async function api(path) {
  let res;
  try {
    res = await fetch(base + "/api/v1" + path, { headers: { Authorization: "Bearer " + token }, cache: "no-store", credentials: "omit" });
  } catch {
    throw new ApiError(0, "network", "The browser could not reach that address. Check it, and note that the server must allow requests from other sites (CORS) for a page like this to work.");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = body.error || {};
    throw new ApiError(res.status, e.code || "error", e.message || "The request failed.");
  }
  return body;
}

const STATE_CLASS = { ready: "good", error: "bad", canceled: "muted", queued: "warn", building: "warn", deploying: "warn" };
const MONITOR_CLASS = { up: "good", down: "bad", unknown: "muted" };

function when(iso) { return iso ? new Date(iso).toLocaleString() : ""; }

async function load() {
  const me = await api("/me");
  $("me").textContent = "Signed in as " + me.user.name + ". Token “" + me.token.name + "” can use: " + me.token.scopes.join(", ") + ". Expires " + when(me.token.expiresAt) + ". " + me.counts.projects + " project(s) on " + me.counts.servers + " server(s).";

  const note = $("projects-note");
  const table = $("projects-table");
  const rows = $("projects");
  rows.replaceChildren();
  note.hidden = true;
  if (!me.token.scopes.includes("projects:read")) {
    table.hidden = true;
    note.textContent = "This token cannot read projects. Add the projects:read permission to see them here.";
    note.hidden = false;
    return;
  }
  const { projects } = await api("/projects");
  table.hidden = projects.length === 0;
  note.textContent = projects.length === 0 ? "No projects yet." : "";
  note.hidden = projects.length !== 0;
  for (const p of projects) {
    const tr = el("tr");
    tr.append(el("td", p.name));
    tr.append(el("td", p.monitor, MONITOR_CLASS[p.monitor] || ""));
    const d = p.latestDeployment;
    tr.append(el("td", d ? d.state + " on " + d.branch + (d.createdAt ? ", " + when(d.createdAt) : "") : "Never deployed", d ? STATE_CLASS[d.state] || "" : "muted"));
    const cell = el("td");
    const btn = el("button", "Details");
    btn.type = "button";
    btn.setAttribute("aria-label", "Show details for " + p.name);
    btn.addEventListener("click", () => showDetail(p, me.token.scopes));
    cell.append(btn);
    tr.append(cell);
    rows.append(tr);
  }
}

async function showDetail(p, scopes) {
  $("detail").hidden = false;
  $("detail-h").textContent = p.name;
  const body = $("detail-body");
  const note = $("detail-note");
  body.replaceChildren();
  note.hidden = true;
  if (!scopes.includes("analytics:read")) {
    note.textContent = "Add the analytics:read permission to see page views here.";
    note.hidden = false;
    return;
  }
  try {
    const { analytics } = await api("/projects/" + encodeURIComponent(p.id) + "/analytics?days=30");
    body.append(el("p", analytics.views + " page views and " + analytics.visitors + " visitors in the last " + analytics.days + " days."));
    const max = Math.max(1, ...analytics.daily.map((d) => d.views));
    const bars = el("div", undefined, "bars");
    bars.setAttribute("role", "img");
    bars.setAttribute("aria-label", "Page views per day for the last " + analytics.days + " days");
    for (const d of analytics.daily) {
      const bar = el("span");
      bar.style.height = Math.max(2, Math.round((d.views / max) * 80)) + "px";
      bar.title = d.day + ": " + d.views + " views";
      bars.append(bar);
    }
    body.append(bars);
  } catch (e) {
    note.textContent = e.message;
    note.hidden = false;
  }
}

function fail(message) {
  const box = $("connect-error");
  box.textContent = message;
  box.hidden = false;
}

async function refresh() {
  try { await load(); } catch (e) {
    if (e.status === 401) { disconnect(); fail(e.message); } else { $("me").textContent = e.message; }
  }
}

function disconnect() {
  token = "";
  if (timer) clearInterval(timer);
  timer = null;
  $("app").hidden = true;
  $("connect-card").hidden = false;
  $("detail").hidden = true;
}

$("connect").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("connect-error").hidden = true;
  base = $("base").value.trim().replace(/\/+$/, "");
  token = $("token").value.trim();
  $("token").value = ""; // the field is emptied at once; the token stays only in memory
  try {
    await load();
  } catch (e) {
    token = "";
    fail(e.message);
    return;
  }
  $("connect-card").hidden = true;
  $("app").hidden = false;
  timer = setInterval(refresh, 60000);
});
$("refresh").addEventListener("click", refresh);
$("disconnect").addEventListener("click", disconnect);
</script>
</body>
</html>
